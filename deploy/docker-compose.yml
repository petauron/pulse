# Requires an image built from this authentication-enabled revision; Alpha.2 lacks these APIs.
# Keep the optional GitHub client secret private and readable by UID 65532.
services:
  senulun:
    image: ${SENULUN_SERVICE_IMAGE:?Set SENULUN_SERVICE_IMAGE to an image built from this revision}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SENULUN_LISTEN: "0.0.0.0:8080"
      SENULUN_ALLOW_PUBLIC_LISTEN: "true"
      SENULUN_DATABASE_PATH: /var/lib/senulun/store/senulun.db
      SENULUN_PUBLIC_URL: ${SENULUN_PUBLIC_URL:?Set the exact browser-facing HTTPS origin}
      # Optional GitHub OAuth: uncomment these and the two secret entries below together.
      # SENULUN_GITHUB_CLIENT_ID: ${SENULUN_GITHUB_CLIENT_ID}
      # SENULUN_GITHUB_CLIENT_SECRET_FILE: /run/secrets/senulun_github_secret
      # SENULUN_GITHUB_ALLOWED_USER_ID: ${SENULUN_GITHUB_ALLOWED_USER_ID}
    volumes:
      - senulun_data:/var/lib/senulun
    # secrets:
    #   - senulun_github_secret

volumes:
  senulun_data:

# secrets:
#   senulun_github_secret:
#     file: ${SENULUN_GITHUB_CLIENT_SECRET_SOURCE_FILE}
