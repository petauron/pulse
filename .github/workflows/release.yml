name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  prepare:
    name: Prepare release from checked main
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      release_tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Wait for the exact source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in $(seq 1 180); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=100" \
              --jq '.workflow_runs | sort_by(.run_number) | last | if . == null then "waiting" elif .status == "completed" then .conclusion else "waiting" end')
            case "$result" in
              success) exit 0 ;;
              waiting) sleep 10 ;;
              *) echo "Source CI did not succeed: $result" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for source CI" >&2
          exit 1
      - name: Require this run to match protected main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release without updating the next version PR
        if: steps.current.outputs.matches == 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          target-branch: main
          skip-github-pull-request: true
      - name: Require the release to use this run's checked source
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: test "$RELEASE_SHA" = "$GITHUB_SHA"

  verify-source:
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    name: Verify protected release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a checked protected-main commit and matching versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          release_version=${RELEASE_TAG#v}
          test "$(jq -r '."."' .release-please-manifest.json)" = "$release_version"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          cargo_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else empty end')
          web_version=$(jq -r .version web/package.json)
          test "$cargo_version" = "$release_version"
          test "$web_version" = "$release_version"
          gate=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "rust" and .conclusion == "success")] | length')
          test "$gate" -ge 1

  binaries:
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    name: Linux ${{ matrix.arch }} binaries
    needs: [prepare, verify-source]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded Web assets
        working-directory: web
        env:
          PULSE_BUILD_GIT_HASH: ${{ needs.prepare.outputs.release_sha }}
        run: |
          npm ci
          npm run build
      - name: Build and verify native release binaries on Debian 12
        env:
          PULSE_BUILD_GIT_HASH: ${{ needs.prepare.outputs.release_sha }}
          PULSE_BUILD_TARGET: ${{ matrix.target }}
        run: sh scripts/build-linux-release.sh
      - name: Stage release archive
        env:
          ARCHIVE_NAME: pulse-${{ needs.prepare.outputs.release_tag }}-linux-${{ matrix.arch }}
        run: |
          install -d "release/$ARCHIVE_NAME/deploy" "release/$ARCHIVE_NAME/docs" "release/$ARCHIVE_NAME/web" "release/$ARCHIVE_NAME/compat/luminaplus"
          install -m 0755 target/release/pulse-service target/release/pulse-agent "release/$ARCHIVE_NAME/"
          install -m 0755 deploy/*.sh "release/$ARCHIVE_NAME/deploy/"
          install -m 0644 deploy/*.service deploy/*.env.example "release/$ARCHIVE_NAME/deploy/"
          install -m 0644 deploy/docker-compose.yml "release/$ARCHIVE_NAME/deploy/"
          install -m 0644 README.md CHANGELOG.md LICENSE NOTICE SECURITY.md Cargo.lock RUST_THIRD_PARTY_LICENSES.html RUST_STDLIB_LICENSES.html "release/$ARCHIVE_NAME/"
          install -m 0644 docs/OPERATIONS.md docs/ARCHITECTURE.md docs/AUTH.md docs/MONITORING.md docs/STORAGE-BENCHMARK.md docs/THEMES.md "release/$ARCHIVE_NAME/docs/"
          install -m 0644 compat/luminaplus/* "release/$ARCHIVE_NAME/compat/luminaplus/"
          install -m 0644 web/THIRD_PARTY_NOTICES.md web/LICENSE.* web/package-lock.json "release/$ARCHIVE_NAME/web/"
          install -m 0644 web/dist/THIRD_PARTY_LICENSES.md "release/$ARCHIVE_NAME/web/"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf "release/$ARCHIVE_NAME.tar.gz" -C release "$ARCHIVE_NAME"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: release/pulse-${{ needs.prepare.outputs.release_tag }}-linux-${{ matrix.arch }}
          format: spdx-json
          output-file: release/pulse-${{ needs.prepare.outputs.release_tag }}-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Stage native assets in the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" \
            "release/pulse-$RELEASE_TAG-linux-$ARCH.tar.gz" \
            "release/pulse-$RELEASE_TAG-linux-$ARCH.spdx.json" --clobber

  container:
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    name: Validate ${{ matrix.arch }} container
    needs: [prepare, binaries]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            archive_arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            archive_arch: aarch64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Download verified native archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.archive_arch }}
        run: |
          mkdir -p release
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --dir release \
            --pattern "pulse-$RELEASE_TAG-linux-$ARCH.tar.gz"
      - name: Prepare image contents
        run: |
          mkdir -p image/${{ matrix.arch }}
          tar -xzf release/pulse-${{ needs.prepare.outputs.release_tag }}-linux-${{ matrix.archive_arch }}.tar.gz --strip-components=1 -C image/${{ matrix.arch }}
      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: image
          file: Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=release-container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-container-${{ matrix.arch }}
          build-args: PULSE_BUILD_GIT_HASH=${{ needs.prepare.outputs.release_sha }}

  publish:
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    name: Publish GitHub release
    needs: [prepare, binaries, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --dir release \
            --pattern "pulse-$RELEASE_TAG-linux-*.tar.gz" \
            --pattern "pulse-$RELEASE_TAG-linux-*.spdx.json"
      - name: Prepare both native image contents
        run: |
          mkdir -p image/amd64 image/arm64
          tar -xzf release/pulse-${{ needs.prepare.outputs.release_tag }}-linux-x86_64.tar.gz --strip-components=1 -C image/amd64
          tar -xzf release/pulse-${{ needs.prepare.outputs.release_tag }}-linux-aarch64.tar.gz --strip-components=1 -C image/arm64
      - name: Stage adapted theme package and license
        run: |
          install -m 0644 compat/luminaplus/LuminaPlus-v1.3.5-pulse.zip release/
          install -m 0644 compat/luminaplus/LICENSE release/LICENSE.LuminaPlus
      - name: Create checksums
        working-directory: release
        run: sha256sum pulse-*.tar.gz pulse-*.spdx.json LuminaPlus-v1.3.5-pulse.zip LICENSE.LuminaPlus > SHA256SUMS
      - name: Attest binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Upload assets to the Release Please draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release/* --clobber
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable ARM64 container execution
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Push the validated image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: image
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=release-container-amd64
            type=gha,scope=release-container-arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.release_tag }}
            ghcr.io/${{ github.repository }}:sha-${{ needs.prepare.outputs.release_sha }}
          build-args: PULSE_BUILD_GIT_HASH=${{ needs.prepare.outputs.release_sha }}
      - name: Attest container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Remove a container published by a failed draft release
        if: (failure() || cancelled()) && steps.draft.outcome == 'success'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$release_state" = false ]; then
            echo "GitHub Release is already public; retaining its completed container."
            exit 0
          fi
          test "$release_state" = true

          package_name=${GITHUB_REPOSITORY#*/}
          owner_type=$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.type)
          case "$owner_type" in
            Organization) versions_endpoint="orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions?per_page=100" ;;
            User) versions_endpoint="users/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions?per_page=100" ;;
            *) echo "unsupported repository owner type: $owner_type" >&2; exit 1 ;;
          esac
          versions=$(gh api --paginate "$versions_endpoint" 2>/dev/null || true)
          if [ -z "$versions" ]; then
            exit 0
          fi
          version_id=$(printf '%s\n' "$versions" | jq -s -r --arg tag "$RELEASE_TAG" \
            'add | [.[] | select(.metadata.container.tags | index($tag))] | first | .id // empty')
          if [ -n "$version_id" ]; then
            case "$owner_type" in
              Organization) delete_endpoint="orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions/$version_id" ;;
              User) delete_endpoint="users/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions/$version_id" ;;
            esac
            gh api --method DELETE "$delete_endpoint"
          fi

  release-pr:
    name: Prepare next version PR and start its CI
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || (needs.prepare.outputs.release_created != 'true' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Maintain version PR without publishing
        id: release_pr
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          target-branch: main
          skip-github-release: true
      # GITHUB_TOKEN-created PR workflows can require manual approval.
      # Explicit dispatch starts the existing CI on the version PR branch.
      - name: Dispatch CI for the version PR
        if: steps.release_pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release_pr.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RELEASE_PR" | jq -er '.headBranchName')
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run dependency-review.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
