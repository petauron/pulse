name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify-source:
    name: Verify protected release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a checked protected-main commit and matching versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          release_version=${GITHUB_REF_NAME#v}
          cargo_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | if length == 1 then .[0] else empty end')
          web_version=$(jq -r .version web/package.json)
          test "$cargo_version" = "$release_version"
          test "$web_version" = "$release_version"
          gate=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "rust" and .conclusion == "success")] | length')
          test "$gate" -ge 1

  binaries:
    name: Linux ${{ matrix.arch }} binaries
    needs: verify-source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded Web assets
        working-directory: web
        env:
          PULSE_BUILD_GIT_HASH: ${{ github.sha }}
        run: |
          npm ci
          npm run build
      - name: Build and verify native release binaries on Debian 12
        env:
          PULSE_BUILD_GIT_HASH: ${{ github.sha }}
          PULSE_BUILD_TARGET: ${{ matrix.target }}
        run: sh scripts/build-linux-release.sh
      - name: Stage release archive
        env:
          ARCHIVE_NAME: pulse-${{ github.ref_name }}-linux-${{ matrix.arch }}
        run: |
          install -d "release/$ARCHIVE_NAME/deploy" "release/$ARCHIVE_NAME/docs" "release/$ARCHIVE_NAME/web"
          install -m 0755 target/release/pulse-service target/release/pulse-agent "release/$ARCHIVE_NAME/"
          install -m 0755 deploy/*.sh "release/$ARCHIVE_NAME/deploy/"
          install -m 0644 deploy/*.service deploy/*.env.example "release/$ARCHIVE_NAME/deploy/"
          install -m 0644 README.md LICENSE NOTICE SECURITY.md Cargo.lock RUST_THIRD_PARTY_LICENSES.html RUST_STDLIB_LICENSES.html "release/$ARCHIVE_NAME/"
          install -m 0644 docs/OPERATIONS.md docs/ARCHITECTURE.md "release/$ARCHIVE_NAME/docs/"
          install -m 0644 web/THIRD_PARTY_NOTICES.md web/LICENSE.* web/package-lock.json "release/$ARCHIVE_NAME/web/"
          install -m 0644 web/dist/THIRD_PARTY_LICENSES.md "release/$ARCHIVE_NAME/web/"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf "release/$ARCHIVE_NAME.tar.gz" -C release "$ARCHIVE_NAME"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: release/pulse-${{ github.ref_name }}-linux-${{ matrix.arch }}
          format: spdx-json
          output-file: release/pulse-${{ github.ref_name }}-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload staged release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            release/pulse-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
            release/pulse-${{ github.ref_name }}-linux-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  container:
    name: Validate multi-architecture container
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable ARM64 container execution
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-to: type=gha,mode=max,scope=release-container
          build-args: PULSE_BUILD_GIT_HASH=${{ github.sha }}

  publish:
    name: Publish GitHub release
    needs: [binaries, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-linux-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum pulse-*.tar.gz pulse-*.spdx.json > SHA256SUMS
      - name: Attest binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Stage immutable tag assets as a draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if existing_state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$existing_state" = true
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            prerelease_flag=
            case "$GITHUB_REF_NAME" in *-*) prerelease_flag=--prerelease ;; esac
            gh release create "$GITHUB_REF_NAME" release/* \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $prerelease_flag
          fi
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable ARM64 container execution
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Push the validated image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-container
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: PULSE_BUILD_GIT_HASH=${{ github.sha }}
      - name: Attest container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Remove a container published by a failed draft release
        if: (failure() || cancelled()) && steps.draft.outcome == 'success'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$release_state" = false ]; then
            echo "GitHub Release is already public; retaining its completed container."
            exit 0
          fi
          test "$release_state" = true

          package_name=${GITHUB_REPOSITORY#*/}
          owner_type=$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.type)
          case "$owner_type" in
            Organization) versions_endpoint="orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions?per_page=100" ;;
            User) versions_endpoint="users/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions?per_page=100" ;;
            *) echo "unsupported repository owner type: $owner_type" >&2; exit 1 ;;
          esac
          versions=$(gh api --paginate "$versions_endpoint" 2>/dev/null || true)
          if [ -z "$versions" ]; then
            exit 0
          fi
          version_id=$(printf '%s\n' "$versions" | jq -s -r --arg tag "$GITHUB_REF_NAME" \
            'add | [.[] | select(.metadata.container.tags | index($tag))] | first | .id // empty')
          if [ -n "$version_id" ]; then
            case "$owner_type" in
              Organization) delete_endpoint="orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions/$version_id" ;;
              User) delete_endpoint="users/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions/$version_id" ;;
            esac
            gh api --method DELETE "$delete_endpoint"
          fi
