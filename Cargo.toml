[workspace]
members = [
  "crates/pulse-agent",
  "crates/pulse-protocol",
  "crates/pulse-service",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/petauron/pulse"
authors = ["Petauron"]

[workspace.dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
subtle = "2.6.1"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth", "zeroize"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
hex = "0.4.3"
mime_guess = "2.0.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rust-embed = "8.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
time = { version = "0.3.47", features = ["formatting"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt"] }
uuid = { version = "1.22.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
